<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ventas Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        :root { --bg: #000; --card: #121212; --text: #eee; --gray: #888; --accent: #fff; --red: #ff4444; --green: #44ff44; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 15px; padding-bottom: 120px; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .dashboard { 
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 1px solid #333; border-radius: 20px; padding: 20px; margin-bottom: 20px;
        }
        .main-stat { text-align: center; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .main-stat h1 { margin: 5px 0; font-size: 2.5em; color: var(--accent); }
        .sub-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat span { font-size: 0.7em; color: var(--gray); font-weight: bold; }
        .stat h3 { margin: 5px 0; font-size: 1.3em; }

        .filters { background: #111; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #222; }
        .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { color: var(--gray); font-size: 0.75em; margin-left: 5px; display: block; margin-bottom: 4px; }
        input[type="date"], .input-estilo, .search-bar { 
            background: #1a1a1a; border: 1px solid #333; color: #fff; 
            padding: 14px; border-radius: 10px; font-size: 16px; outline: none;
            width: calc(100% - 30px);
        }
        .search-bar { width: calc(100% - 28px); margin-top: 10px; border-color: #444; }
        
        .btn-excel { background: var(--green); color: #000; width: 100%; margin-top: 15px; border-radius: 10px; padding: 14px; font-weight: 800; border: none; cursor: pointer; }
        .btn-delete-all { background: none; color: #555; border: 1px solid #333; width: 100%; margin-top: 50px; padding: 12px; border-radius: 10px; font-size: 0.75em; cursor: pointer; }

        .card { 
            background: var(--card); border: 1px solid #222; padding: 18px; 
            border-radius: 15px; margin-bottom: 12px; position: relative;
        }
        .card-pagada { opacity: 0.6; }
        
        .actions-top { position: absolute; top: 15px; right: 15px; display: flex; gap: 12px; align-items: center; }
        .btn-mini { background: none; border: none; color: var(--gray); font-size: 1.3em; cursor: pointer; padding: 5px; }
        .btn-cobrar { color: var(--green); font-size: 1.5em; }

        .badge { font-size: 0.65em; padding: 4px 10px; border-radius: 6px; font-weight: 800; display: inline-block; margin-bottom: 8px; }
        .badge-deuda { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid rgba(255,68,68,0.3); }
        .badge-pago { background: rgba(68,255,68,0.15); color: var(--green); border: 1px solid rgba(68,255,68,0.3); }
        
        .client-info b { font-size: 1.2em; color: #fff; display: block; padding-right: 90px; }
        .client-info small { color: var(--gray); font-size: 0.8em; }
        
        .amounts { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; }
        .val-total { color: var(--gray); font-size: 0.85em; }
        .val-pending { font-size: 1.3em; font-weight: 900; color: var(--red); }
        
        .fab { 
            position: fixed; bottom: 30px; right: 25px; background: var(--green); color: #000; 
            width: 65px; height: 65px; border-radius: 20px; font-size: 40px; border: none; 
            z-index: 10; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: #111; padding: 25px; border-radius: 20px; width: 88%; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="main-stat">
            <span style="font-size: 0.7em; color: var(--gray); font-weight: bold;">TOTAL VENTAS PERÍODO</span>
            <h1 id="total-ventas-mes">$0</h1>
        </div>
        <div class="sub-stats">
            <div class="stat"><span>COBRADO</span><h3 id="cobrado-mes" style="color: var(--green);">$0</h3></div>
            <div class="stat"><span>DEUDA</span><h3 id="deuda-mes" style="color: var(--red);">$0</h3></div>
        </div>
    </div>

    <div class="filters">
        <div class="filter-row">
            <div><label>Desde:</label><input type="date" id="f-desde" onchange="render()"></div>
            <div><label>Hasta:</label><input type="date" id="f-hasta" onchange="render()"></div>
        </div>
        <input type="text" id="search" class="search-bar" placeholder="🔍 Buscar cliente..." oninput="render()">
        <button class="btn-excel" onclick="exportarExcel()">📥 EXPORTAR EXCEL</button>
    </div>

    <div id="lista-clientes"></div>

    <button class="btn-delete-all" onclick="borrarTodo()">Limpiar Historial Completo</button>
    <button class="fab" onclick="abrirModal()">+</button>

    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-titulo" style="margin-top:0">Nueva Venta</h2>
            <input type="hidden" id="edit-id">
            <label>Fecha de la venta:</label>
            <input type="date" id="fecha-carga" class="input-estilo" style="margin-bottom:12px">
            <label>Cliente:</label>
            <input type="text" id="nombre" class="input-estilo" placeholder="Nombre completo" style="margin-bottom:12px" list="lista-contactos" autocomplete="off">
            <datalist id="lista-contactos"></datalist>
            <input type="text" id="total_v" class="input-estilo" placeholder="Monto total ($)" style="margin-bottom:12px" oninput="formatearInput(this)">
            <label>Entrega inicial (opcional):</label>
            <input type="text" id="entrega" class="input-estilo" placeholder="¿Cuánto entrega ahora? ($)" style="margin-bottom:20px" oninput="formatearInput(this)">
            <button onclick="guardarVenta()" style="width:100%; padding:16px; background:var(--green); border:none; border-radius:12px; font-weight:800;">GUARDAR VENTA</button>
            <button onclick="cerrarModal()" style="width:100%; background:none; color:var(--gray); border:none; margin-top:20px;">Cerrar</button>
        </div>
    </div>

    <script>
        let storage = JSON.parse(localStorage.getItem('app_v_final')) || { deudas: [], historialPagos: [], pagados: [] };
        if (!storage.historialPagos) storage.historialPagos = [];

        const hoy = new Date();
        document.getElementById('f-desde').value = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('f-hasta').value = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).toISOString().split('T')[0];

        function guardarData() { localStorage.setItem('app_v_final', JSON.stringify(storage)); render(); }
        function formatearInput(i) { let v = i.value.replace(/\D/g, ""); i.value = v === "" ? "" : parseInt(v).toLocaleString('es-AR'); }
        function limpiarPuntos(t) { return parseFloat(t.toString().replace(/\./g, "").replace(/,/g, "")) || 0; }
        
       function abrirModal() { 
    document.getElementById('modal').style.display = 'flex'; 
    document.getElementById('fecha-carga').value = new Date().toISOString().split('T')[0];
    
    // Nueva lógica para cargar los nombres de clientes
    const datalist = document.getElementById('lista-contactos');
    const nombresUnicos = new Set();
    
    // Recolectamos nombres de las deudas y de los ya pagados
    storage.deudas.forEach(d => nombresUnicos.add(d.nombre));
    storage.pagados.forEach(p => nombresUnicos.add(p.nombre));
    
    // Limpiamos la lista anterior y cargamos los nombres únicos
    datalist.innerHTML = '';
    nombresUnicos.forEach(nombre => {
        const option = document.createElement('option');
        option.value = nombre;
        datalist.appendChild(option);
    });
}
        function cerrarModal() { 
            document.getElementById('modal').style.display = 'none'; 
            document.getElementById('nombre').value = ''; 
            document.getElementById('total_v').value = ''; 
            document.getElementById('entrega').value = ''; 
            document.getElementById('edit-id').value = ''; 
        }

        function guardarVenta() {
            const idEdit = document.getElementById('edit-id').value;
            const nom = document.getElementById('nombre').value.trim();
            const total = limpiarPuntos(document.getElementById('total_v').value);
            const entrega = limpiarPuntos(document.getElementById('entrega').value);
            const fechaManual = document.getElementById('fecha-carga').value;
            
            if(!nom || total <= 0) return alert("Completa los datos");

            // Si editamos, removemos la versión anterior de ambas listas
            storage.deudas = storage.deudas.filter(d => d.id != idEdit);
            storage.pagados = storage.pagados.filter(p => p.id != idEdit);

            let nuevo = { id: idEdit ? parseInt(idEdit) : Date.now(), nombre: nom, totalOriginal: total, montoPendiente: total - entrega, fecha: fechaManual };
            
            // Si es nueva y hay entrega, registrar en historial
            if(!idEdit && entrega > 0) {
                storage.historialPagos.push({ id: Date.now()+1, nombre: nom, monto: entrega, fechaPago: fechaManual });
            }

            if(nuevo.montoPendiente <= 0) storage.pagados.push(nuevo);
            else storage.deudas.push(nuevo);

            guardarData(); cerrarModal();
        }

        function cobroRapido(id) {
            const idx = storage.deudas.findIndex(c => c.id === id);
            const d = storage.deudas[idx];
            const monto = parseFloat(prompt(`Saldo: $${d.montoPendiente.toLocaleString('es-AR')}\n¿Monto a cobrar?`, d.montoPendiente));
            
            if(!isNaN(monto) && monto > 0) {
                storage.historialPagos.push({ id: Date.now(), nombre: d.nombre, monto: monto, fechaPago: d.fecha });
                d.montoPendiente -= monto;
                if(d.montoPendiente <= 0) storage.pagados.push(storage.deudas.splice(idx, 1)[0]);
                guardarData();
            }
        }

        function editarRegistro(id) {
            let r = storage.deudas.find(d => d.id == id) || storage.pagados.find(p => p.id == id);
            abrirModal();
            document.getElementById('edit-id').value = r.id;
            document.getElementById('fecha-carga').value = r.fecha;
            document.getElementById('nombre').value = r.nombre;
            document.getElementById('total_v').value = r.totalOriginal.toLocaleString('es-AR');
            document.getElementById('entrega').value = (r.totalOriginal - r.montoPendiente).toLocaleString('es-AR');
        }

        function render() {
            const lista = document.getElementById('lista-clientes');
            const search = document.getElementById('search').value.toLowerCase().trim();
            const fD = document.getElementById('f-desde').value;
            const fH = document.getElementById('f-hasta').value;
            
            let vMes = 0, cMes = 0, dMes = 0;
            lista.innerHTML = '';

            storage.deudas.forEach(d => { if(d.fecha >= fD && d.fecha <= fH) { vMes += d.totalOriginal; dMes += d.montoPendiente; }});
            storage.pagados.forEach(p => { if(p.fecha >= fD && p.fecha <= fH) { vMes += p.totalOriginal; }});
            storage.historialPagos.forEach(h => { if(h.fechaPago >= fD && h.fechaPago <= fH) { cMes += h.monto; }});

            let todos = [...storage.deudas, ...storage.pagados].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

            todos.forEach(d => {
                if (d.nombre.toLowerCase().includes(search) && (search !== "" || (d.fecha >= fD && d.fecha <= fH))) {
                    const esD = d.montoPendiente > 0;
                    lista.innerHTML += `
                        <div class="card ${!esD ? 'card-pagada' : ''}">
                            <div class="actions-top">
                                ${esD ? `<button class="btn-mini btn-cobrar" onclick="cobroRapido(${d.id})">💵</button>` : ''}
                                <button class="btn-mini" onclick="editarRegistro(${d.id})">✏️</button>
                                <button class="btn-mini" style="color:var(--red);opacity:0.6" onclick="if(confirm('¿Borrar?')) {storage.deudas=storage.deudas.filter(x=>x.id!=${d.id}); storage.pagados=storage.pagados.filter(x=>x.id!=${d.id}); guardarData();}">🗑️</button>
                            </div>
                            <span class="badge ${esD ? 'badge-deuda' : 'badge-pago'}">${esD ? 'DEUDA' : 'PAGADO'}</span>
                            <div class="client-info"><b>${d.nombre}</b><small>📅 ${d.fecha}</small></div>
                            <div class="amounts">
                                <div class="val-total">Total: $${d.totalOriginal.toLocaleString('es-AR')}</div>
                                ${esD ? `<div class="val-pending">$${d.montoPendiente.toLocaleString('es-AR')}</div>` : `<div style="color:var(--green); font-weight:bold">SALDADO</div>`}
                            </div>
                        </div>`;
                }
            });

            document.getElementById('total-ventas-mes').innerText = `$${vMes.toLocaleString('es-AR')}`;
            document.getElementById('cobrado-mes').innerText = `$${cMes.toLocaleString('es-AR')}`;
            document.getElementById('deuda-mes').innerText = `$${dMes.toLocaleString('es-AR')}`;
        }

        function exportarExcel() {
            const desde = document.getElementById('f-desde').value;
            const hasta = document.getElementById('f-hasta').value;
            let csv = `LISTADO VENTAS (${desde} al ${hasta})\nFECHA;CLIENTE;TOTAL;PAGADO;SALDO\n`;
            [...storage.deudas, ...storage.pagados].forEach(v => {
                if(v.fecha >= desde && v.fecha <= hasta) {
                    csv += `${v.fecha};${v.nombre};${v.totalOriginal};${v.totalOriginal - v.montoPendiente};${v.montoPendiente}\n`;
                }
            });
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Ventas.csv`;
            link.click();
        }

        function borrarTodo() { if(confirm("¿Borrar todo?")) { storage = { deudas: [], historialPagos: [], pagados: [] }; guardarData(); } }
        render();
    </script>
</body>
</html>
